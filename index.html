<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Converter</title>
<style>
  :root {
    --bg: #eef1f5; --card: #ffffff; --ink: #101828; --muted: #5b6678;
    --line: #d5dbe4; --accent: #0f766e; --accent-ink: #ffffff;
    --ok: #15803d; --warn: #b45309; --bad: #b42318;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1118; --card: #151c26; --ink: #e8edf4; --muted: #96a1b3;
      --line: #2a3443; --accent: #2dd4bf; --accent-ink: #04201c;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
  }
  main {
    width: 100%; max-width: 480px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px;
  }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin: 4px 0 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font-variant-numeric: tabular-nums;
  }
  input[readonly] { background: var(--bg); }
  :is(input, select, button):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .swap {
    display: block; margin: 0 auto 14px; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 1.2rem; cursor: pointer; transition: transform .25s;
  }
  .swap:hover { transform: rotate(180deg); }
  .result { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }
  .big { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .rate { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .status {
    display: flex; align-items: center; gap: 8px; margin-top: 20px;
    font-size: .85rem; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-s="live"] .dot { background: var(--ok); }
  .status[data-s="stale"] .dot { background: var(--warn); }
  .status[data-s="error"] .dot { background: var(--bad); }
  .status[data-s="loading"] .dot { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .25; } }
  .status button {
    margin-left: auto; font: inherit; font-size: .85rem; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 12px;
  }
  .status button:disabled { opacity: .5; cursor: progress; }
  @media (max-width: 420px) { main { padding: 20px; } .row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Currency converter</h1>
  <p class="sub">Exchange rates update automatically every 10 minutes.</p>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="amount">Amount</label>
      <div class="row">
        <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="1">
        <select id="from" aria-label="From currency"></select>
      </div>
    </div>

    <button class="swap" id="swap" type="button" aria-label="Swap currencies">⇅</button>

    <div class="field">
      <label for="out">Converted</label>
      <div class="row">
        <input id="out" readonly aria-live="polite">
        <select id="to" aria-label="To currency"></select>
      </div>
    </div>
  </form>

  <div class="result">
    <div class="big" id="big">–</div>
    <div class="rate" id="rate"></div>
  </div>

  <div class="status" id="status" data-s="loading" role="status">
    <span class="dot"></span><span id="statusText">Loading rates…</span>
    <button id="refresh" type="button">Refresh</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const CACHE_KEY = 'fx-cache-v2';
  const REFRESH_MS = 10 * 60 * 1000;
  const STALE_MS = 60 * 60 * 1000;
  const TIMEOUT_MS = 6000;

  // Providers are tried in order; each returns { rates (USD base), updated (ms) }.
  const providers = [
    { name: 'open.er-api.com', url: 'https://open.er-api.com/v6/latest/USD',
      parse: d => { if (d.result !== 'success') throw 0; return { rates: d.rates, updated: d.time_last_update_unix * 1000 }; } },
    { name: 'exchangerate-api.com', url: 'https://api.exchangerate-api.com/v4/latest/USD',
      parse: d => ({ rates: d.rates, updated: (d.time_last_updated || 0) * 1000 }) },
    { name: 'frankfurter.dev', url: 'https://api.frankfurter.dev/v1/latest?base=USD',
      parse: d => ({ rates: { USD: 1, ...d.rates }, updated: Date.parse(d.date) }) }
  ];

  let state = { rates: null, updated: 0, source: '', fetchedAt: 0 };
  let names;
  try { names = new Intl.DisplayNames(['en'], { type: 'currency' }); } catch { names = null; }

  const el = { amount: $('amount'), from: $('from'), to: $('to'), out: $('out'),
    big: $('big'), rate: $('rate'), status: $('status'), text: $('statusText'),
    refresh: $('refresh'), swap: $('swap'), form: $('form') };

  // ---------- storage (safe if blocked) ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } },
    set(v) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch {} }
  };

  // ---------- fetching ----------
  async function fetchJSON(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function load(manual) {
    setStatus('loading', 'Updating rates…');
    el.refresh.disabled = true;
    for (const p of providers) {
      try {
        const { rates, updated } = p.parse(await fetchJSON(p.url));
        if (!rates || !rates.USD) throw 0;
        state = { rates, updated: updated || Date.now(), source: p.name, fetchedAt: Date.now() };
        store.set(state);
        fillSelects();
        update();
        el.refresh.disabled = false;
        return renderStatus();
      } catch { /* try the next provider */ }
    }
    el.refresh.disabled = false;
    if (state.rates) renderStatus(true);
    else { setStatus('error', 'Could not load rates. Check your connection and try again.'); update(); }
  }

  // ---------- UI ----------
  function fillSelects() {
    const codes = Object.keys(state.rates).sort();
    const keep = { from: el.from.value || 'USD', to: el.to.value || 'EUR' };
    for (const sel of [el.from, el.to]) {
      sel.replaceChildren(...codes.map(c => new Option(names ? `${c} – ${names.of(c) || c}` : c, c)));
    }
    el.from.value = codes.includes(keep.from) ? keep.from : 'USD';
    el.to.value = codes.includes(keep.to) ? keep.to : codes[0];
  }

  function fmt(n, cur) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(n); }
    catch { return n.toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' ' + cur; }
  }

  function update() {
    if (!state.rates) { el.big.textContent = '–'; el.out.value = ''; el.rate.textContent = ''; return; }
    const from = el.from.value, to = el.to.value;
    const rf = state.rates[from], rt = state.rates[to];
    if (!rf || !rt) { el.big.textContent = 'Rate unavailable'; el.out.value = ''; el.rate.textContent = ''; return; }
    const rate = rt / rf;
    const amount = Math.max(parseFloat(el.amount.value) || 0, 0);
    const result = amount * rate;
    el.out.value = result.toLocaleString(undefined, { maximumFractionDigits: 4 });
    el.big.textContent = fmt(result, to);
    el.rate.textContent = `1 ${from} = ${rate.toLocaleString(undefined, { maximumSignificantDigits: 6 })} ${to}`;
  }

  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 24 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
  }

  function setStatus(s, msg) { el.status.dataset.s = s; el.text.textContent = msg; }

  function renderStatus(failed) {
    if (!state.rates) return;
    const age = Date.now() - state.updated;
    const when = `Rates from ${state.source || 'saved copy'}, updated ${ago(state.updated)}`;
    if (failed) setStatus('stale', `Offline – showing saved rates. ${when}.`);
    else if (age > STALE_MS) setStatus('stale', `${when}. The provider's data may be delayed.`);
    else setStatus('live', when + '.');
  }

  // ---------- events ----------
  el.form.addEventListener('submit', e => e.preventDefault());
  el.amount.addEventListener('input', update);
  el.from.addEventListener('change', update);
  el.to.addEventListener('change', update);
  el.swap.addEventListener('click', () => { [el.from.value, el.to.value] = [el.to.value, el.from.value]; update(); });
  el.refresh.addEventListener('click', () => load(true));
  addEventListener('online', () => load());
  addEventListener('offline', () => renderStatus(true));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - state.fetchedAt > REFRESH_MS) load();
  });
  setInterval(() => { if (!document.hidden && navigator.onLine) load(); }, REFRESH_MS);
  setInterval(() => { if (state.rates && el.status.dataset.s !== 'loading') renderStatus(!navigator.onLine); }, 60000);

  // ---------- start ----------
  const cached = store.get();
  if (cached && cached.rates) { state = cached; fillSelects(); update(); renderStatus(true); setStatus('loading', 'Checking for newer rates…'); }
  else { el.from.add(new Option('USD', 'USD')); el.to.add(new Option('EUR', 'EUR')); el.to.value = 'EUR'; }
  load();
})();
</script>
</body>
</html>
